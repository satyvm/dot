# T3 Code remote development stack.
#
# Deliberately has no Coolify domain and no published TCP port. The only
# ingress is the Tailscale sidecar, which owns its own tailnet node; upstream
# advises against exposing a T3 Code server to the public internet because its
# only authentication is a pairing token.
services:
  tailscale:
    image: tailscale/tailscale:v1.102.3
    hostname: t3-dev
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Docker's embedded resolver at 127.0.0.11 must keep serving Compose
      # service names such as `cliproxyapi`. Accepting tailnet DNS would
      # overwrite /etc/resolv.conf in this shared namespace and break that.
      # This is a name-resolution setting, not a security control: traffic is
      # still WireGuard-encrypted and tailnet-authenticated either way.
      TS_ACCEPT_DNS: "false"
      TS_SOCKET: /run/tailscale/tailscaled.sock
      # tag:t3 keeps the node key from expiring. TS_EXTRA_ARGS is appended to
      # `tailscale up`, which has no --port flag; --port belongs to tailscaled
      # and must go through TS_TAILSCALED_EXTRA_ARGS or containerboot dies with
      # "flag provided but not defined: -port" before it ever authenticates.
      TS_EXTRA_ARGS: --advertise-tags=tag:t3
      # Avoids contending with the host's tailscaled for the same UDP mapping.
      TS_TAILSCALED_EXTRA_ARGS: --port=41642
    volumes:
      - ts-state:/var/lib/tailscale
      - tailscale-socket:/run/tailscale
    ports:
      - "41642:41642/udp"
    networks:
      - t3-net
    healthcheck:
      test: ["CMD", "tailscale", "--socket=/run/tailscale/tailscaled.sock", "status", "--peers=false"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  t3code:
    build:
      # Relative to the Compose project directory (the repository root under
      # Coolify), and the Dockerfile's COPY paths are relative to this context.
      context: ./t3code
      dockerfile: Dockerfile
      args:
        REMOTE_UID: ${REMOTE_UID:-1000}
        REMOTE_GID: ${REMOTE_GID:-1000}
    restart: unless-stopped
    # Shares the sidecar's network namespace: reachable at the tailnet node,
    # and therefore cannot declare its own ports or networks.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      t3-control:
        condition: service_healthy
    environment:
      DEV_SSH_PUBLIC_KEY: ${DEV_SSH_PUBLIC_KEY:?}
      REMOTE_DOTFILES_REPO: ${REMOTE_DOTFILES_REPO:-https://github.com/satyvm/dot.git}
      REMOTE_GIT_NAME: ${REMOTE_GIT_NAME:-Satyam}
      REMOTE_GIT_EMAIL: ${REMOTE_GIT_EMAIL:-75127014+satyvm@users.noreply.github.com}
      T3CODE_HOME: /home/ubuntu/.t3
      TEA_SOCKET_PATH: /run/tea/tea.sock
      T3_SHARE_SOCKET_PATH: /run/t3-share/control.sock
    volumes:
      - /home/ubuntu/dev:/home/ubuntu/dev
      - t3-home:/home/ubuntu
      - t3-state:/home/ubuntu/.t3
      - npm-global:/home/ubuntu/.npm-global
      # chezmoi installs the package catalog into this prefix at first boot, so
      # it has to outlive the container filesystem like every other state dir.
      - linuxbrew:/home/linuxbrew
      - ssh-host-keys:/etc/ssh/host-keys
      - platform-secrets:/run/platform-secrets:ro
      - tea-socket:/run/tea
      - t3-share-socket:/run/t3-share:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/3773'"]
      interval: 30s
      timeout: 8s
      start_period: 180s
      retries: 5
    deploy:
      resources:
        # Docker rejects a cpus limit above the host's core count, and this one
        # shares an Ampere A1 with Coolify, Traefik and the live sites. These
        # are ceilings, not reservations: under contention the scheduler still
        # shares fairly. Raise them in the Coolify environment on a bigger host
        # rather than editing this file.
        limits:
          memory: ${T3CODE_MEMORY:-4G}
          cpus: "${T3CODE_CPUS:-1.5}"

  t3-control:
    build:
      context: ./t3code
      dockerfile: Dockerfile.control
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      TS_SOCKET: /run/tailscale/tailscaled.sock
      T3_SHARE_SOCKET_PATH: /run/t3-share/control.sock
      TEA_SOCKET_PATH: /run/tea/tea.sock
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_URL: ${GITEA_URL:-https://gitea.satyvm.com}
      REMOTE_GID: ${REMOTE_GID:-1000}
    volumes:
      - tailscale-socket:/run/tailscale:ro
      - t3-share-socket:/run/t3-share
      - t3-share-state:/var/lib/t3-share
      - tea-socket:/run/tea
    healthcheck:
      test: ["CMD", "python3", "/usr/local/lib/t3-control/t3_control.py", "--healthcheck"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  cliproxyapi:
    # Opt-in: `docker compose --profile gateway up`. Plain agent commands never
    # touch it; ax gateway mode and explicitly configured T3 instances do.
    profiles: ["gateway"]
    # Digest-pinned: this container holds the Antigravity/Codex OAuth
    # credentials, so a redeploy must not silently adopt a new upstream build.
    image: eceasy/cli-proxy-api:v7.3.3@sha256:f9abbf3fa5fed1ca5410cf207eeae6d7c3d7d1b5305397fc928d4d43d4474d15
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command:
      - /bin/bash
      - -euc
      - |
        umask 077
        printf '%s\n' "$${CLIPROXY_CLIENT_KEY}" > /secrets/client-key
        cat > /config/config.yaml <<EOF
        host: "0.0.0.0"
        port: 8317
        tls:
          enable: false
        remote-management:
          allow-remote: false
          secret-key: "$${CLIPROXY_MANAGEMENT_KEY}"
          disable-control-panel: true
        auth-dir: "/root/.cli-proxy-api"
        api-keys:
          - "$${CLIPROXY_CLIENT_KEY}"
        debug: false
        logging-to-file: true
        logs-max-total-size-mb: 100
        usage-statistics-enabled: false
        request-retry: 5
        max-retry-credentials: 3
        max-retry-interval: 60
        quota-exceeded:
          switch-project: true
          switch-preview-model: true
          antigravity-credits: false
        routing:
          strategy: "round-robin"
          session-affinity: true
          session-affinity-ttl: "24h"
        ws-auth: true
        oauth-model-alias:
          antigravity:
            - name: "gemini-3.6-flash-high"
              alias: "fast"
              display-name: "Fast"
              fork: true
              force-mapping: true
          codex:
            - name: "gpt-5.6-sol"
              alias: "frontier"
              display-name: "Frontier"
              fork: true
              force-mapping: true
            - name: "gpt-5.6-terra"
              alias: "balanced"
              display-name: "Balanced"
              fork: true
              force-mapping: true
            - name: "gpt-5.4-mini"
              alias: "light"
              display-name: "Light"
              fork: true
              force-mapping: true
        EOF
        # Optional: OpenRouter is a plain API key, not an OAuth login, so it
        # only needs a config block, never `ax auth setup`. Add more entries
        # under `models:` for every OpenRouter model you want an alias for.
        if [[ -n "$${OPENROUTER_API_KEY:-}" ]]; then
          cat >> /config/config.yaml <<EOF
        openai-compatibility:
          - name: "openrouter"
            base-url: "https://openrouter.ai/api/v1"
            api-key-entries:
              - api-key: "$${OPENROUTER_API_KEY}"
            models:
              - name: "openrouter/auto"
                alias: "openrouter-auto"
              - name: "stealth/union-alpha"
                alias: "union-alpha"
        EOF
        fi
        chmod 0600 /config/config.yaml /secrets/client-key
        exec ./CLIProxyAPI -config /config/config.yaml
    environment:
      CLIPROXY_CLIENT_KEY: ${CLIPROXY_CLIENT_KEY:?}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEPLOY: cloud
      PORT: "8317"
    volumes:
      - cliproxy-config:/config
      - cliproxy-auth:/root/.cli-proxy-api
      - platform-secrets:/secrets
    networks:
      - t3-net
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8317'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  t3-net:
    driver: bridge

volumes:
  ts-state:
  tailscale-socket:
  t3-share-socket:
  t3-share-state:
  t3-home:
  t3-state:
  npm-global:
  linuxbrew:
  ssh-host-keys:
  platform-secrets:
  cliproxy-config:
  cliproxy-auth:
  tea-socket:
