[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:provision]
# Installs the package catalog with chezmoi. Runs as root (it uses runuser) and
# alongside sshd and t3 serve rather than before them, so a first boot that
# builds the whole toolchain neither delays the deploy nor withholds the shell.
# autorestart=false: it is a one-shot job, and exiting 0 is success.
command=/usr/local/bin/t3code-entrypoint provision
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=5
environment=PATH="/home/ubuntu/.local/bin:/home/ubuntu/.npm-global/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=unexpected
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:t3code]
command=/home/ubuntu/.npm-global/bin/t3 serve --host 0.0.0.0
directory=/home/ubuntu/dev
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",SHELL="/bin/zsh",PATH="/home/ubuntu/.local/bin:/home/ubuntu/.npm-global/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",T3CODE_HOME="/home/ubuntu/.t3",NPM_CONFIG_PREFIX="/home/ubuntu/.npm-global",TEA_SOCKET_PATH="/run/tea/tea.sock"
autorestart=unexpected
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
