[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=unexpected
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:t3code]
command=/home/ubuntu/.npm-global/bin/t3 serve --host 0.0.0.0
directory=/home/ubuntu/dev
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",SHELL="/bin/zsh",PATH="/home/ubuntu/.npm-global/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",T3CODE_HOME="/home/ubuntu/.t3",NPM_CONFIG_PREFIX="/home/ubuntu/.npm-global",TEA_SOCKET_PATH="/run/tea/tea.sock"
autorestart=unexpected
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
