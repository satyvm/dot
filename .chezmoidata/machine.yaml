machineModel:
  schemaVersion: 1
  supported:
    os: [darwin, linux]
    arch: [amd64, arm64]
    linuxDistros: [debian, ubuntu]
  presets:
    minimal:
      description: Personal machine with a focused GUI set and no AI tooling.
      features:
        cli: true
        developer: false
        ai: false
        aiGateway: none
        guiTier: minimum
        osCustomization: true
        hardening: false
        ssh: false
    workstation:
      description: Full development machine with every managed GUI application and local AI tooling.
      features:
        cli: true
        developer: true
        ai: true
        aiGateway: local
        guiTier: all
        osCustomization: true
        hardening: false
        ssh: true
    server:
      description: Headless host with CLI terminal tools and optional Linux hardening.
      features:
        cli: true
        developer: true
        ai: false
        aiGateway: none
        guiTier: none
        osCustomization: false
        hardening: true
        ssh: true
    container:
      description: Generic image-provisioned environment without AI tooling.
      features:
        cli: true
        developer: true
        ai: false
        aiGateway: none
        guiTier: none
        osCustomization: false
        hardening: false
        ssh: false
    t3:
      description: Image-provisioned T3 Code remote development environment.
      features:
        cli: true
        developer: true
        ai: true
        aiGateway: sidecar
        guiTier: none
        osCustomization: false
        hardening: false
        ssh: false
