services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.2.95
    restart: unless-stopped
    command:
      - /bin/bash
      - -euc
      - |
        umask 077
        printf '%s\n' "$${CLIPROXY_CLIENT_KEY}" > /secrets/client-key
        cat > /config/config.yaml <<EOF
        host: "0.0.0.0"
        port: 8317
        tls:
          enable: false
        remote-management:
          allow-remote: false
          secret-key: "$${CLIPROXY_MANAGEMENT_KEY}"
          disable-control-panel: true
        auth-dir: "/root/.cli-proxy-api"
        api-keys:
          - "$${CLIPROXY_CLIENT_KEY}"
        debug: false
        logging-to-file: true
        logs-max-total-size-mb: 100
        usage-statistics-enabled: false
        request-retry: 5
        max-retry-credentials: 3
        max-retry-interval: 60
        quota-exceeded:
          switch-project: true
          switch-preview-model: true
          antigravity-credits: false
        routing:
          strategy: "round-robin"
          session-affinity: true
          session-affinity-ttl: "24h"
        ws-auth: true
        oauth-model-alias:
          antigravity:
            - name: "gemini-3.6-flash-high"
              alias: "fast"
              display-name: "Fast"
              fork: true
              force-mapping: true
          codex:
            - name: "gpt-5.6-sol"
              alias: "frontier"
              display-name: "Frontier"
              fork: true
              force-mapping: true
            - name: "gpt-5.6-terra"
              alias: "balanced"
              display-name: "Balanced"
              fork: true
              force-mapping: true
            - name: "gpt-5.4-mini"
              alias: "light"
              display-name: "Light"
              fork: true
              force-mapping: true
        EOF
        chmod 0600 /config/config.yaml /secrets/client-key
        exec ./CLIProxyAPI -config /config/config.yaml
    environment:
      CLIPROXY_CLIENT_KEY: ${CLIPROXY_CLIENT_KEY:?}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:?}
      DEPLOY: cloud
      PORT: "8317"
    volumes:
      - cliproxy-config:/config
      - cliproxy-auth:/root/.cli-proxy-api
      - platform-secrets:/secrets
    networks:
      - hermes-net
    healthcheck:
      test:
        - CMD-SHELL
        - bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8317'
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  tea-sidecar:
    build:
      context: ./hermes
      dockerfile: Dockerfile.tea
    restart: unless-stopped
    environment:
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_URL: ${GITEA_URL:-https://gitea.satyvm.com}
      TEA_SOCKET_PATH: /run/tea/tea.sock
    volumes:
      - tea-socket:/run/tea
    networks:
      - hermes-net
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; s = socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/run/tea/tea.sock"); s.close()
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  hermes-dev:
    build:
      context: ./hermes
      dockerfile: Dockerfile
      args:
        REMOTE_UID: ${REMOTE_UID:-1000}
        REMOTE_GID: ${REMOTE_GID:-1000}
        HERMES_WEBUI_VERSION: ${HERMES_WEBUI_VERSION:-0.51.92}
        HERMES_AGENT_VERSION: ${HERMES_AGENT_VERSION:-0.18.2}
    restart: unless-stopped
    depends_on:
      cliproxyapi:
        condition: service_healthy
      tea-sidecar:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_SSH_PORT:-22223}:22"
    environment:
      SERVICE_URL_HERMESDEV_8787:
      DEV_SSH_PUBLIC_KEY: ${DEV_SSH_PUBLIC_KEY:?}
      REMOTE_DOTFILES_REPO: ${REMOTE_DOTFILES_REPO:-https://github.com/satyvm/dot.git}
      REMOTE_GIT_NAME: ${REMOTE_GIT_NAME:-Satyam}
      REMOTE_GIT_EMAIL: ${REMOTE_GIT_EMAIL:-75127014+satyvm@users.noreply.github.com}
      HERMES_HOME: /home/ubuntu/.hermes
      HERMES_WEBUI_STATE_DIR: /home/ubuntu/.hermes/webui
      HERMES_WEBUI_DEFAULT_WORKSPACE: /home/ubuntu/dev
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_AGENT_DIR: /opt/hermes-agent
      HERMES_WEBUI_PYTHON: /opt/hermes-venv/bin/python
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:?}
      HERMES_SKIP_CHMOD: "1"
      OPENAI_API_BASE: http://cliproxyapi:8317/v1
      OPENAI_BASE_URL: http://cliproxyapi:8317/v1
      OPENAI_API_KEY: ${CLIPROXY_CLIENT_KEY:?}
      TEA_SOCKET_PATH: /run/tea/tea.sock
    volumes:
      - /home/ubuntu/dev:/home/ubuntu/dev
      - remote-home:/home/ubuntu
      - hermes-state:/home/ubuntu/.hermes
      - ssh-host-keys:/etc/ssh/host-keys
      - platform-secrets:/run/platform-secrets:ro
      - tea-socket:/run/tea
    networks:
      - hermes-net
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8787/health
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

networks:
  hermes-net:
    driver: bridge

volumes:
  remote-home:
  hermes-state:
  ssh-host-keys:
  platform-secrets:
  cliproxy-config:
  cliproxy-auth:
  tea-socket:
